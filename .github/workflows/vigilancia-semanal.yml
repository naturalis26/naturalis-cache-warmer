name: Naturalis - vigilancia semanal (fotos, cache, tema)

# Si algo falla abre un aviso (issue) cuyo titulo dice que arreglar, p. ej.
# "Naturalis: corregir peso de fotos (2)". GitHub lo envia por correo. Detalle en vigilancia_semanal.py.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      prueba_aviso:
        description: "Simular un fallo para probar que llega el correo"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  vigilancia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Comprobar
        env:
          PRUEBA_AVISO: ${{ inputs.prueba_aviso && '1' || '0' }}
        run: python3 vigilancia_semanal.py
      - name: Abrir aviso con lo que hay que arreglar
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "$(cat aviso_titulo.txt)" --body-file aviso_cuerpo.txt
